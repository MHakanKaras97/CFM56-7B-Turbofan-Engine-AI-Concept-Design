description: NASA 7-coefficient polynomials for cp, h and s0 of ideal-gas species (tools/thermo.py)
form:
  cp/R: a1 + a2*T + a3*T^2 + a4*T^3 + a5*T^4
  h/(R*T): a1 + a2*T/2 + a3*T^2/3 + a4*T^3/4 + a5*T^4/5 + a6/T
  s0/R: a1*ln(T) + a2*T + a3*T^2/2 + a4*T^3/3 + a5*T^4/4 + a7
  ranges: 'low: T_ranges[0]..T_ranges[1], high: T_ranges[1]..T_ranges[2]; R = universal gas constant per mol'
source:
  primary: McBride B.J., Gordon S., Reno M.A., Coefficients for Calculating Thermodynamic and Transport Properties of Individual
    Species, NASA TM-4513, 1993 (https://ntrs.nasa.gov/citations/19940013151)
  license: US Government work, public domain
  retrieved_from: Cantera data/nasa_gas.yaml (ck2yaml conversion of the NASA 7-coefficient file), commit 9573e6b1e1097dca3bf86da37726333ab62663bb,
    sha256 4de6199d65d2d3db782e30573720c723130953707336add59713b02d8667e4db, retrieved 2026-10-18
  tag: K
universal_gas_constant:
  value: 8.314462618
  unit: J/(mol K)
  tag: G
  note: CODATA 2018 exact value
reference_temperature:
  value: 298.15
  unit: K
  tag: G
  note: sensible enthalpy and LHV reference
