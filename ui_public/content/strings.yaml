metrics:
  thrust: {tr: "İtki: motorun uçağı ileri iten kuvveti. Fan ve çekirdek lülelerinden çıkan havanın momentum artışından gelir; deniz seviyesi, kalkış koşulunda.", en: "Thrust: the force that pushes the aircraft forward. It comes from the momentum gain of the air leaving the fan and core nozzles; sea level, take-off."}
  sfc: {tr: "Özgül yakıt tüketimi (SFC): bir kilonewton itki için saniyede yakılan yakıt (gram). Küçük olması daha verimli motor demektir.", en: "Specific fuel consumption (SFC): grams of fuel burned per second for each kilonewton of thrust. Lower means a more efficient engine."}
  egt_margin: {tr: "EGT payı: gösterilen egzoz gazı sıcaklığı ile sertifika sınırı arasındaki fark. Motor yaşlandıkça azalır; bakım planlamasının temel göstergesidir.", en: "EGT margin: the gap between the indicated exhaust gas temperature and the certified limit. It shrinks as the engine ages; a key indicator for maintenance planning."}
  w2: {tr: "W2: fan yüzünden saniyede geçen toplam hava kütlesi. Bunun büyük kısmı baypastan, küçük kısmı çekirdekten geçer.", en: "W2: the total air mass per second through the fan face. Most of it goes through the bypass, a small part through the core."}
  bpr: {tr: "Baypas oranı: fanın baypastan geçirdiği havanın çekirdeğe giren havaya oranı. Yüksek olması yakıt verimini artırır.", en: "Bypass ratio: air through the bypass divided by air through the core. Higher means better fuel efficiency."}
  opr: {tr: "Toplam basınç oranı: kompresör çıkışı ile fan girişi arasındaki basınç oranı. Çevrim veriminin ana belirleyicisidir.", en: "Overall pressure ratio: compressor exit pressure divided by fan inlet pressure. The main driver of cycle efficiency."}
  label_bpr: {tr: Baypas oranı, en: Bypass ratio}
  label_opr: {tr: Toplam basınç oranı, en: Overall pressure ratio}
  label_thrust: {tr: İtki, en: Thrust}
  label_sfc: {tr: SFC, en: SFC}
  label_egt_margin: {tr: EGT payı, en: EGT margin}
  label_w2: {tr: W2 hava debisi, en: W2 airflow}
checks:
  Fan choke (HARD): {tr: "Fan tıkanması: fan yüzündeki özgül debi, havanın ses hızında tıkandığı sınırın altında olmalı. Aşılırsa fan daha fazla hava geçiremez; bu yüzden sert kontroldür.", en: "Fan choke: the specific flow at the fan face must stay below the choking limit (sonic flow). Above it the fan cannot pass more air, so this is a hard check."}
  Fan specific flow W2/A: {tr: "Fan özgül debisi: birim fan alanından geçen hava. Modern fanlar için tipik bant içinde olması, fan çapının ve debinin tutarlı olduğunu gösterir.", en: "Fan specific flow: air per unit fan area. Being inside the typical band of modern fans shows that fan diameter and airflow are consistent."}
  W2 vs estimate: {tr: "Toplam hava debisinin bağımsız tahminle karşılaştırması; kalibrasyonun makul olduğunu doğrular.", en: "Total airflow compared with an independent estimate; confirms the calibration is reasonable."}
  Total secondary air fraction: {tr: "Soğutma ve sızdırmazlık için kompresörden alınan havanın oranı. Bu hava itki üretmez ama türbinin dayanması için şarttır.", en: "Share of compressor air taken for cooling and sealing. This air makes no thrust but is essential for turbine life."}
  SFC vs ICAO/TCDS: {tr: "Hesaplanan özgül yakıt tüketiminin yayınlanmış sertifika/emisyon verisiyle uyumu; modelin doğruluğunun ana testi.", en: "Computed fuel consumption against published certification/emissions data; the main accuracy test of the model."}
  EGT displayed vs TCDS limit: {tr: "Kokpitte gösterilecek egzoz sıcaklığının sertifika sınırının altında kalması. Sıcak bölüm ömrünü korur.", en: "The exhaust temperature shown in the cockpit must stay below the certified limit. Protects the hot-section life."}
  EGT model vs Girão: {tr: "Model egzoz sıcaklığının bir yayındaki değerle karşılaştırması (yalnız bilgi).", en: "Model exhaust temperature compared with a published value (information only)."}
  Combustor air W31 vs references: {tr: "Yanma odasına giren havanın kaynak değerlerle karşılaştırması (yalnız bilgi).", en: "Combustor inlet air compared with reference values (information only)."}
  V18/V8 ideal: {tr: "Fan ve çekirdek lüle çıkış hızlarının oranı. İkisi dengeli olduğunda itki verimi yüksek olur (yalnız bilgi).", en: "Ratio of fan and core nozzle exit velocities. Well-balanced jets give high propulsive efficiency (information only)."}
  T4 vs references: {tr: "Türbin giriş sıcaklığı: motorun en sıcak noktası. Malzeme ve soğutma teknolojisinin sınırını belirler (yalnız bilgi).", en: "Turbine inlet temperature: the hottest point of the engine. It sets the limit of materials and cooling technology (information only)."}
  T3 vs test cell: {tr: "Kompresör çıkış sıcaklığının test hücresi verisiyle karşılaştırması (yalnız bilgi).", en: "Compressor exit temperature compared with test-cell data (information only)."}
station_cols:
  Tt: {tr: "Toplam sıcaklık (K): durgun hal sıcaklığı; kompresörde artar, yanma odasında en yükseğe çıkar, türbinde düşer.", en: "Total temperature (K): stagnation temperature; rises in the compressors, peaks in the combustor, falls in the turbines."}
  Pt: {tr: "Toplam basınç (kPa): kompresörlerle artar, türbinler ve lülelerde işe ve hıza dönüşür.", en: "Total pressure (kPa): raised by the compressors, turned into work and velocity in turbines and nozzles."}
  W: {tr: "Kütle debisi (kg/s): o noktadan saniyede geçen gaz.", en: "Mass flow (kg/s): gas passing that point per second."}
  FAR: {tr: "Yakıt/hava oranı: yanma odasından sonra sıfırdan büyüktür.", en: "Fuel/air ratio: greater than zero after the combustor."}
