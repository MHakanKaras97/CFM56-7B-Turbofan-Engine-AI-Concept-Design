  '4': {tr: Yanma odası çıkışı (türbin girişi), en: Combustor exit (turbine inlet)}
  '41': {tr: HPT rotor girişi (NGV soğutma havası karıştıktan sonra), en: HPT rotor inlet (after NGV cooling air mixes in)}
  '43': {tr: HPT rotor çıkışı, en: HPT rotor exit}
  '44': {tr: HPT çıkışı (rotor soğutma havası karıştıktan sonra), en: HPT exit (after rotor cooling air mixes in)}
