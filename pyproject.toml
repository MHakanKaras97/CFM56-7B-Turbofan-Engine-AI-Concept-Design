[project]
name = "turbofan-agent"
version = "0.1.0"
description = "Concept-level CFM56-7B27 class turbofan design via a multi-agent system."
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "streamlit==1.65.0",
    "cadquery==2.8.0",
    "cadquery-ocp==7.9.3.1.1",
    "gmsh==4.15.2",
    "pypdf==6.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
