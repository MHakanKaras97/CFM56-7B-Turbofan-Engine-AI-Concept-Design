[project]
name = "turbofan-agent"
version = "0.1.0"
description = "Concept-level CFM56-7B27 class turbofan design via a multi-agent system."
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
