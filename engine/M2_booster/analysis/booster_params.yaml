description: >-
  M2 booster meanline inputs (method choices with their rule and source). Budget values (pr_booster, eta_booster,
  duct_25_24, station 21/24/25 states, N1) are not here: the code reads them from the ICD via core.budgets.read_icd.
  Station 21 annulus: engine/M1_inlet_fan/geometry/flowpath.yaml (read-only). Rotor blade counts: rules/known_values.md
  (read by code). M2 step 2.
stage_count: {value: 3, unit: '-', tag: KS, note: 'R-AM2.1; Girão 2023 PDF p. 36, Owner''s Guide s. 10, Lolis 2014 s. 122'}
work_split: {value: equal_stage_pressure_ratio, unit: '-', tag: T, note: meanline plan step 3}
stage_efficiency: {value: polytropic_equivalent_of_eta_booster, unit: '-', tag: H, note: 'same polytropic efficiency in every stage, solved so that the overall isentropic efficiency equals the ICD eta_booster (ADR-015, R-AM2.4)'}
loss_split_rotor: {value: 0.5, unit: '-', tag: T, note: 'share of the stage entropy rise taken in the rotor; only sets the rotor-exit Pt (density for the annulus)'}
annulus: {value: constant_hub_constant_axial_mach, unit: '-', tag: T, note: 'meanline plan step 5: constant hub radius (Lolis 2014 Table 4.10 [KS]); tip radius from continuity with the station 21 axial Mach number'}
stator_exit_swirl: {value: 0.0, unit: deg, tag: T, note: 'stators return the flow to axial (station 21 has no swirl); same inlet triangle for every rotor'}
vortex: {value: free_vortex, unit: '-', tag: G, note: 'meanline plan step 6: r Vt constant, uniform work and axial velocity'}
mean_radius: {value: arithmetic, unit: '-', tag: T, note: 'r_m = (r_hub + r_tip) / 2 at each plane'}
rotor_aspect_ratio: {value: 2.0, unit: '-', tag: KS, note: 'R-AM2.3; Lolis 2014 Table 4.10, method assumption'}
stator_aspect_ratio: {value: 1.2, unit: '-', tag: KS, note: 'R-AM2.3; Lolis 2014 Table 4.10, method assumption'}
df_limit_rotor_tip: {value: 0.45, unit: '-', tag: K, note: 'R-AM2.2; RM E53D01 summary p. 1'}
df_limit_other: {value: 0.58, unit: '-', tag: K, note: 'R-AM2.2; TP-1523 stage 28B-22, p. 3 and Table 1'}
solidity_tip_range: {value: [0.9, 2.0], unit: '-', tag: K, note: 'TP-1523 Table 1 tested tip solidity range'}
