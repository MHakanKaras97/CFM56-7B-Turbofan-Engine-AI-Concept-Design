  columns: [station, r1_cm, r2_cm, W1, W2, Vt1, Vt2, U1, U2, solidity, df_table]
  rows:
  - [tip, 25.400, 25.400, 269.5, 177.0, 0.0, 93.8, 243.9, 243.9, 1.595, 0.452]
  - [mid, 22.856, 22.860, 247.6, 162.5, 0.0, 93.4, 219.5, 219.5, 1.773, 0.450]
  - [hub, 20.320, 20.320, 226.2, 125.4, 0.0, 113.2, 195.1, 195.1, 1.995, 0.571]
  repairs:
  - {cell: tip D-FACT, raw: '"0A52"', value: 0.452, tag: K}
  - {cell: mid D-FACT, raw: '"0.**_t50_**"', value: 0.450, tag: K}
applicability:
  description: >-
    Booster vs the TP-1523 rig (hub/tip 0.8, U_tip 243.8 m/s, subsonic). Computed [H] by
    tests/test_m2_sources.py from M1 flowpath.yaml station 21 (rev014, read-only), the ICD (read_icd: station 21,
    station 24, pr_booster) and N1 = Girão nominal LP speed 5282 rpm [KS] (ICD shafts). Stage values assume a
    constant hub radius (Lolis 2014 method assumption [KS]), constant axial Mach number equal to station 21,
    equal stage pressure ratio and equal temperature rise [T]: a bracket, not a design.
  station21_hub_tip: {value: 0.6970, unit: '-', tag: H}
  station21_tip_speed: {value: 239.78, unit: m/s, tag: H}
  station21_tip_speed_vs_rig: {value: -0.0165, unit: '-', tag: H}
  station21_mach: {value: 0.3927, unit: '-', tag: H}
  station21_tip_relative_mach: {value: 0.787, unit: '-', tag: H, note: 'no inlet swirl [T]; rig rotor 23B tip 0.801 [K] table 2(b)'}
  stage_exit_hub_tip: {value: [0.7307, 0.7631, 0.7934], unit: '-', tag: T}
  stage_exit_tip_speed: {value: [228.7, 219.0, 210.6], unit: m/s, tag: T}
  lolis_mach_0p5_exit_hub_tip: {value: 0.8197, unit: '-', tag: T, note: 'same bracket with axial Mach 0.5 (Lolis table 4.10); needs a station 21 area change'}
  verdict: >-
    Subsonic like the rig. Tip speed within 2 % at the booster inlet, falling to about 14 % below the rig at the
    stage 3 exit (constant hub). Hub/tip 0.697 at stage 1 inlet is 13 % below the rig 0.8 (outside); stage 3
    exit 0.79 is inside. Stage 1 is an extrapolation -> open issue #57.
a1_case:
  description: >-
    Validation case A-1 (aero_method.md): rotor 23B design point, Table 2(b) p. 21 tip, mid-span (RP5) and hub rows
    as printed (velocities m/s, angles deg from axial). Inputs of the M2 meanline are the radii, rpm, mean inlet
    meridional velocity, inlet total state, rotor PR and TR (table 2(a) p. 20, coefficient_check); the exit rows
    are comparison values. Read in M2 step 2 from sources_text (values were missing above).
  page: 21
  tag: K
  inlet_total_pressure: {value: 101.3, unit: kPa, tag: K, note: 'table 2(b) TOTAL PRESS IN 10.13 N/cm2 at every radius'}
  rotor_total_temperature_ratio: {value: 1.072, unit: '-', tag: K, note: 'table 2(a) p. 20, 3 decimals'}
  rotor_adiabatic_efficiency: {value: doğrulanamadı, unit: '-', tag: K, note: 'OCR "0.9L3"; A-1 uses the PR/TR pair'}
  columns: [station, r_in_cm, r_out_cm, vm_in, vm_out, vt_out, u_in, u_out, beta_rel_in, beta_rel_out, tt_ratio, df_table]
  rows:
  - [tip, 25.400, 25.400, 114.6, 93.7, 93.8, 243.9, 243.9, 64.8, 58.0, 1.079, 0.452]
  - [mid, 22.856, 22.860, 114.5, 102.5, 93.4, 219.5, 219.5, 62.4, 50.9, 1.071, 0.450]
  - [hub, 20.320, 20.320, 114.3, 94.9, 113.2, 195.1, 195.1, 59.6, 40.8, 1.076, 0.571]
  repairs:
  - {cell: tip REL BETAM OUT, raw: '"5E.0"', value: 58.0, tag: K, note: 'atan((243.9 - 93.8) / 93.7) = 58.0 deg'}
  - {cell: mid MERID VEL OUT, raw: '"i02.5"', value: 102.5, tag: K, note: 'atan((219.5 - 93.4) / 102.5) = 50.9 deg = REL BETAM OUT'}
