description: >-
  NASA TP-1523 (Britsch, Osborn, Laessig 1979) reference data for M2, transcribed from the text conversion
  (sources_text/aero/britsch_1979_tp1523.md, OCR quality). Pages are printed pages. Values checked by
  tests/test_m2_sources.py (solidity, aspect ratio, hub/tip, diffusion factor). Repairs are listed with the
  raw OCR string; every repaired value is reproduced by an identity in the test. M2 step 1.
source: {id: 45, file: aero/britsch_1979_tp1523.md}
rig:
  tip_diameter: {value: 50.8, unit: cm, tag: K, note: constant through each stage, p. 2}
  hub_tip_ratio: {value: 0.8, unit: '-', tag: K, note: constant through each stage, summary p. 1 and p. 2}
  design_tip_speed: {value: 243.8, unit: m/s, tag: K, note: summary p. 1}
  design_mass_flow: {value: 9.46, unit: kg/s, tag: K, note: six design stages, p. 3}
  design_rpm_23B: {value: 9170.0, unit: rpm, tag: K, note: 'table 2(a) p. 20, OCR "917O.GOC"'}
  solidity_definition: {value: tip_radius, unit: '-', tag: K, note: 'table 1 solidity is at the tip radius (p. 3; symbol list p. 12 "at maximum radius"); blade tables 8-17 give solidity per radius on the mean of the LE and TE radii (checked numerically)'}
  aspect_ratio_definition: {value: span_over_mean_chord, unit: '-', tag: K, note: 'symbol list p. 11: blade height over mean chord length; span = r_tip - r_hub = 5.08 cm'}
  diffusion_factor_equation_B4: {value: doğrulanamadı, unit: '-', tag: K, note: 'eq. B4 p. 13 is an image in the text conversion; settled numerically, see df_check'}
coefficient_check:
  description: >-
    Table 2(a) stage 23B-20 (p. 20) head-rise and flow coefficients. The appendix B formulas (p. 14-15) are images
    in the text; settled numerically by the test: head-rise = cp T1 (PR^((gamma-1)/gamma) - 1) / U_tip^2 (cp 1004,
    gamma 1.40, p. 11), flow coefficient = inlet axial velocity / U_tip.
  inlet_total_temperature: {value: 288.2, unit: K, tag: K, note: table 2(b) p. 21}
  rotor_pressure_ratio: {value: 1.257, unit: '-', tag: K}
  stage_pressure_ratio: {value: 1.252, unit: '-', tag: K}
  rotor_head_rise_coefficient: {value: 0.329, unit: '-', tag: K, note: 'OCR "C.329"'}
  stage_head_rise_coefficient: {value: 0.322, unit: '-', tag: K, note: 'OCR "3.322"'}
  flow_coefficient: {value: 0.470, unit: '-', tag: K, note: 'OCR "C.L-,O" read as 0.470 = 114.6 / 243.9; repaired'}
  inlet_axial_velocity_tip: {value: 114.6, unit: m/s, tag: K, note: table 2(b) p. 21}
  tip_speed: {value: 243.9, unit: m/s, tag: K}
