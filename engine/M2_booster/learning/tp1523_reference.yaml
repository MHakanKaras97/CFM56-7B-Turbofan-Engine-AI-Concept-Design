df_check:
  description: >-
    Table 2(b) rotor 23B (p. 21) design velocities, m/s; D-FACT column vs Lieblein velocity form with the local
    blade-table solidity (tools.meanline.diffusion_factor). Absolute inlet swirl 0. Relative tangential
    velocity Wt = U - Vt.
