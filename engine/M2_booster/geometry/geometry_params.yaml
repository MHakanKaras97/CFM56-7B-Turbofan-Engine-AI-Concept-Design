description: 'M2 geometry step 1 rule constants (rules/geometry.md R-G2.1-8). Design values (chords, angles, counts,
  radii, areas) are not here: the code reads them from the active record. One tag per field.'
axial_gap_fraction:
  value: 0.25
  unit: '-'
  tag: T
  note: R-G2.2; axial gap = fraction x axial width of the upstream row; no booster source, order of the usual
    compressor gap/chord range [G] not verified against a CFM56 value
rotor_tc_hub:
  value: 0.06
  unit: '-'
  tag: T
  note: R-G2.3; max thickness / chord at the rotor hub section; order of TP-1523 rotor 23B Table 8 (p. 37) TM / aero
    chord at the hub, OCR partly unreadable (#59), proportional transfer, no CFM56 value
rotor_tc_tip:
  value: 0.03
  unit: '-'
  tag: T
  note: R-G2.3; as rotor_tc_hub, tip section; mean section t/c linear in span fraction between hub and tip
stator_tc:
  value: 0.05
  unit: '-'
  tag: T
  note: R-G2.3; constant over span; TP-1523 stator 20 Table 14 (p. 43) chord not read (doğrulanamadı), estimate
edge_thickness_ratio:
  value: 0.01
  unit: '-'
  tag: T
  note: R-G2.3; blunt LE/TE thickness / chord; order of TP-1523 TI/TO 0.051 cm on a 5.08 cm chord (Table 8 p. 37)
span_extension_ratio:
  value: 0.15
  unit: '-'
  tag: T
  note: R-G2.4; loft extension beyond hub and tip = ratio x row mean height (construction only, trimmed away)
tip_clearance_source_cm:
  value: 0.036
  unit: cm
  tag: K
  note: TP-1523 Table 18 p. 47, rotor 23B static tip clearance, arithmetic average
rig_blade_height_cm:
  value: 5.08
  unit: cm
  tag: K
  note: TP-1523 rig annulus height (constant-area annulus), aero_method.md Aspect ratio
tip_clearance_ratio:
  value: clearance_source_over_rig_height
  unit: '-'
  tag: T
  note: R-G2.6; tip_clearance_source_cm / rig_blade_height_cm computed in code, proportional transfer to the booster
    rotor mean height
rotor_material:
  value: ti6al4v
  unit: '-'
  tag: T
  note: R-G2.7, materials.md (analogy with the M1 fan blade); density from tools/data/materials.yaml
stator_mass_material:
  value: ti6al4v
  unit: '-'
  tag: T
  note: R-G2.7; stator material is tbd (materials.md); placeholder density for the informational mass only (#71)
area_tolerance:
  value: 0.001
  unit: '-'
  tag: T
  note: R-G2.8; relative; record areas carry 5 decimals (rounding below 1e-4 relative)
chord_solidity_tolerance:
  value: 0.005
  unit: '-'
  tag: T
  note: R-G2.8; relative
radius_tolerance_m:
  value: 1.0e-05
  unit: m
  tag: T
  note: R-G2.8; root/tip vertex radius vs the flow path line
hw_running_gap_over_row_gap:
  value: 0.2
  unit: '-'
  tag: T
  note: R-G2.9 (step 2); axial running gap between rotating and stationary flow path surfaces / inter-row gap; no
    booster source
hw_slot_width_over_normal_pitch:
  value: 0.5
  unit: '-'
  tag: T
  note: R-G2.10; rotor slot width / (hub pitch x cos hub stagger); leaves a rim lug of the same order between slots
hw_slot_depth_over_rotor_chord:
  value: 0.25
  unit: '-'
  tag: T
  note: R-G2.10; slot depth below the smallest rim hub radius / rotor chord; no source (doğrulanamadı)
hw_rim_depth_over_slot_depth:
  value: 1.0
  unit: '-'
  tag: T
  note: R-G2.10; live rim depth below the slot bottom / slot depth; same ratio idea as M1 rotor_params
    rim_depth_below_slot_over_neck (analogy, not a source)
hw_drum_wall_over_hub_radius:
  value: 0.015
  unit: '-'
  tag: T
  note: R-G2.10; drum wall thickness / smallest stator hub radius; structural sizing later (A-4)
hw_fit_clearance_over_slot_width:
  value: 0.02
  unit: '-'
  tag: T
  note: R-G2.10/R-G2.12; root block and vane foot fit clearance / slot width (rotor) or groove depth (stator)
hw_shroud_thickness_over_stator_chord:
  value: 0.08
  unit: '-'
  tag: T
  note: R-G2.11; inner shroud radial thickness / stator chord
hw_land_thickness_over_stator_chord:
  value: 0.06
  unit: '-'
  tag: T
  note: R-G2.11; seal land radial thickness / stator chord (land material not chosen)
hw_land_length_over_shroud_length:
  value: 0.7
  unit: '-'
  tag: T
  note: R-G2.11; seal land axial length / shroud axial length, centred
hw_tooth_count:
  value: 2
  unit: '-'
  tag: T
  note: R-G2.11; seal teeth per stator land
hw_tooth_width_over_land_length:
  value: 0.1
  unit: '-'
  tag: T
  note: R-G2.11; rectangular tooth axial width / land length
hw_tooth_height_over_land_thickness:
  value: 1.0
  unit: '-'
  tag: T
  note: R-G2.11; tooth radial height / land thickness
hw_seal_clearance_over_tip_clearance:
  value: 1.0
  unit: '-'
  tag: T
  note: R-G2.11; radial seal clearance / R-G2.6 tip clearance of the upstream rotor
hw_casing_thickness_over_radius:
  value: 0.02
  unit: '-'
  tag: T
  note: R-G2.12; casing wall / casing radius; same ratio as the M1 splitter wall (fan_frame_params, analogy only)
hw_vane_slot_margin_over_row_width:
  value: 0.1
  unit: '-'
  tag: T
  note: R-G2.12; casing vane groove axial margin each side / stator row axial width
hw_vane_slot_depth_over_stator_chord:
  value: 0.05
  unit: '-'
  tag: T
  note: R-G2.12; casing vane groove depth / stator chord
hw_foot_span_over_pitch:
  value: 0.95
  unit: '-'
  tag: T
  note: R-G2.12; vane foot angular span / vane pitch angle
hw_flange_thickness_over_drum_wall:
  value: 2.0
  unit: '-'
  tag: T
  note: R-G2.13; forward flange axial thickness / stage 1 drum wall thickness
hw_common_volume_tolerance:
  value: 1.0e-06
  unit: '-'
  tag: T
  note: R-G2.17; common volume / smaller solid volume treated as zero (touching faces)
hw_min_wall_m:
  value: 0.001
  unit: m
  tag: T
  note: R-G2.17; smallest wall (live rim, drum wall, casing behind the groove) for a buildable part, not a structural
    criterion
