  notes: 'Unit mass 66.5338 kg [H] = solid volume x density (drum 66.5338 kg); information only (A-5, check value Lolis about 171 kg [KS weak]). Material ti6al4v [T] (rules/materials.md, analogy with the M1 fan blade). One solid with the forward cone (R-G2.18), the hub flow-path wall (R-G2.20), the stage 1 flange and the seal teeth (R-G2.11); straight slots along the slot axis (R-G2.19). Booster spool LLP 23,600 EFC, 22,900 EFC for -7B27 (Owner''s Guide mtce s. 19-20) [KS], conflict open (#49). Bolts and bolt holes not modelled (J2-1, #76).'
