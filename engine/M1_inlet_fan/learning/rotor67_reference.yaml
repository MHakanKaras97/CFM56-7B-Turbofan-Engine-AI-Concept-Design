  extracted_to: learning/rotor67_geometry.yaml (generated by analysis/rotor67_tables.py, with plausibility flags)
  content: 14 surfaces of revolution from hub (1) to casing (14), 35 points each; per point Z, R, angular coordinates of both surfaces, normal thickness, camber-line and surface angles; leading and trailing edge circle data before each section
  geometry_origin: Z = 0 at the intersection of blade leading edge and hub; rotor hub rotates from Z = -1.374 cm to Z = 9.365 cm
  tip_definition: section 14 lies outside the blade; tip = section 14 minus the clearance, normal to the casing
  hot_geometry: coordinates are the running (design speed) shape, NASTRAN deflections corrected to laser tip measurements
