blade_sections:
  page: 18-32
  table: I
  extracted_to: learning/rotor67_geometry.yaml (generated by analysis/rotor67_tables.py, with plausibility flags)
  content: 14 surfaces of revolution from hub (1) to casing (14), 35 points each; per point Z, R, angular coordinates of both surfaces, normal thickness, camber-line and surface angles; leading and trailing edge circle data before each section
  geometry_origin: Z = 0 at the intersection of blade leading edge and hub; rotor hub rotates from Z = -1.374 cm to Z = 9.365 cm
  tip_definition: section 14 lies outside the blade; tip = section 14 minus the clearance, normal to the casing
  hot_geometry: coordinates are the running (design speed) shape, NASTRAN deflections corrected to laser tip measurements
flowpath:
  page: 33
  table: II
  extracted_to: learning/rotor67_geometry.yaml
measured_passage_mach:
  description: relative Mach number just upstream of the passage shock, read by eye from the TP-2879 laser anemometer streamwise plots (relative Mach along constant-pitch lines; 0 % pitch = suction surface of one blade), near peak efficiency
  tag: KS
  method: read from plot (page scans extracted at 300 dpi, viewed at half scale); value = highest point before the drop through the passage shock on each pitch line
  uncertainty: '+-0.02 at 10 % span (gridlines 0.1 apart), +-0.03 at 30 and 70 % span (gridlines 0.15 apart); laser data are ensemble averages over many passages, so the shock is smeared and the true pre-shock peak may be slightly higher'
  span_convention: percent span from the tip (TP-2879); span fraction from the hub = 1 - span_from_tip
  spans:
  - span_from_tip: 0.10
    figure: 18
    pdf_pages: [58, 59]
    printed_pages: [54, 55]
    upstream_M1rel: [1.33, 1.37]
    pre_shock_by_pitch: {0.1: 1.42, 0.2: 1.40, 0.3: 1.40, 0.4: 1.37, 0.5: 1.36, 0.6: 1.36}
    note: passage shock drop between about 40 and 60 % chord; 70-90 % pitch (PDF p. 60) not read
  - span_from_tip: 0.30
    figure: 22
    pdf_pages: [84, 85]
    printed_pages: [80, 81]
    upstream_M1rel: [1.18, 1.25]
    pre_shock_by_pitch: {0.1: 1.42, 0.2: 1.43, 0.3: 1.43, 0.4: 1.40, 0.5: 1.39, 0.6: 1.32}
    note: strong acceleration over the front suction surface from about 1.25 to 1.43 before the shock; 70-90 % pitch (PDF p. 86) not read
  - span_from_tip: 0.70
    figure: 30
    pdf_pages: [122, 123]
    printed_pages: [116, 117]
    upstream_M1rel: [0.93, 0.95]
    pre_shock_by_pitch: null
    leading_edge_peak_by_pitch: {0.1: 1.12, 0.2: 1.20, 0.3: 1.21, 0.4: 1.22, 0.5: 1.12, 0.6: 1.07}
    note: no passage shock; a short supersonic spike just behind the leading edge, then smooth deceleration to about 0.62 at the trailing edge
