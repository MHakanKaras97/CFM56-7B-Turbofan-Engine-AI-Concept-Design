  pages: 'p. N = printed page; PDF page = printed page + 4'
  cross_check: Khelghatibana 2014, Table 3.1 (PDF p. 37) repeats the design values below
  license: US Government work (NASA TP); facts only, own wording
  tag: KS
  text_layer: scanned report with OCR text; table values marked ocr_check were read from the OCR layer and checked for consistency in tests/test_m1_sources.py
