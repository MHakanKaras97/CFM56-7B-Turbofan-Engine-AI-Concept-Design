description: M1 fan design inputs (analysis/fan_design.py). Budget values (W2, W21,
  Tt2, Pt2, FPR, pr_fan_inner) and the rotor speed are read from the ICD at run time
  through core.budgets.read_icd; they are not copied here.
icd_inputs:
  rotor_speed: ICD shafts.LP.speed_refs.girao_nominal (Girão 2023 nominal LP speed)
    [KS]
  inlet_state: ICD stations 2 Tt, Pt [H]
  mass_flows: ICD M1 budget W2, W21, W13 [H]
  stream_targets: ICD M1 budget FPR (outer tubes), pr_fan_inner (inner tubes) [KS]
annulus:
  fan_tip_diameter:
    value: 61.0
    unit: in
    tag: T
    note: about 61 in in docs/learning/CFM56-7B27_Parca_Bilgi_Dokumani.txt (secondary,
      no citation; primary source doğrulanmadı); M0 cycle_params uses the same value
      tagged T. Checked against the ICD fan_face_area in fan_design.py
  hub_tip_ratio:
    value: 0.3
    unit: '-'
    tag: T
    note: same value as M0 used for its W2/A check; confirmed against the ICD fan_face_area
      in fan_design.py
  exit_tip_radius_ratio:
    value: 0.98
    unit: '-'
    tag: T
    note: rotor exit casing radius / inlet tip radius; slightly converging casing
      over the blade, Rotor 67 survey stations give 24.4043/25.654 = 0.951 (Strazisar
      1989 p. 34, rotor67_reference.yaml) [H]; a high bypass fan casing converges
      less [T]
  exit_hub_radius_ratio:
    value: 1.45
    unit: '-'
    tag: T
    note: rotor exit hub radius / inlet hub radius; rising hub so that the inner tubes
      reach their pressure ratio with Vt2 below U2; Rotor 67 survey stations give
      12.0167/9.1465 = 1.314 (Strazisar 1989 p. 34) [H]; chosen from a scratch sweep
      of 1.30 and 1.45 with exit tip ratios 0.92-0.98 (M1 step 3 report); outer efficiency
      moves by about 0.01 across it
  exit_core_area_fraction:
    value: 0.2
    unit: '-'
    tag: T
    note: share of the rotor exit annulus area given to the inner (core) tubes; larger
      than the inlet share because the core stream is compressed less
stream_tubes:
  n_inner:
    value: 3
    unit: '-'
    tag: T
    note: inner (core) tubes between hub and splitter, equal inlet area (= equal mass
      flow with the uniform inlet of solve_rotor)
  n_outer:
    value: 6
    unit: '-'
    tag: T
    note: outer (bypass) tubes between splitter and tip, equal inlet area
blading:
  blade_count:
    value: 24
    unit: '-'
    tag: KS
    source: Girão 2023; Fox, Rossey, Raguet 2023, p. 1439
  design_incidence:
    value: 3.0
    unit: deg
    tag: T
    note: same at every tube; the Rotor 67 meanline design point gives 3.4 to 8.0
      deg (analysis/rotor67_validation.yaml) [H]; the lower end is taken to limit
      the shock loss
  df_limit_hub:
    value: 0.6
    unit: '-'
    tag: KS
    source: 'Abrisha 2026, PDF p. 38 (printed p. 26): DF 0.3 - 0.6 for tip and hub
      respectively as a practical design criterion'
  df_limit_tip:
    value: 0.3
    unit: '-'
    tag: KS
    source: Abrisha 2026, PDF p. 38 (printed p. 26)
  df_limit_distribution:
    value: linear
    tag: T
    note: DF limit linear in inlet span fraction between hub and tip; each tube gets
      the lowest solidity that keeps DF at its local limit (solidity bounds below)
  solidity_min:
    value: 1.0
    unit: '-'
    tag: T
    note: lower bound of the solidity search
  solidity_max:
    value: 3.2
    unit: '-'
    tag: T
    note: upper bound of the solidity search; Rotor 67 hub solidity 3.11 (Strazisar
      1989 p. 2) [KS]
mechanical:
  taper_ratio:
    value: 0.4
    unit: '-'
    tag: T
    note: blade cross-section area tip/root, linear in radius; a solid wide-chord
      blade has a thick root and a thin tip, chord grows towards the tip, so the area
      falls less than the thickness; the uniform blade (1.0) is reported as the upper
      bound
  safety_factor:
    value: 1.5
    unit: '-'
    tag: T
    note: on the yield strength (materials.yaml ti6al4v yield_strength [KS]); centrifugal
      stress only, no gas bending, dovetail or fatigue
