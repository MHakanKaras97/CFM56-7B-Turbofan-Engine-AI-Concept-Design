description: M1 fan design inputs (analysis/fan_design.py). Budget values (W2, W21,
  Tt2, Pt2, FPR, pr_fan_inner) and the rotor speed are read from the ICD at run time
  through core.budgets.read_icd; they are not copied here.
icd_inputs:
  rotor_speed: ICD shafts.LP.speed_refs.girao_nominal (Girão 2023 nominal LP speed)
    [KS]
  inlet_state: ICD stations 2 Tt, Pt [H]
  mass_flows: ICD M1 budget W2, W21, W13 [H]
  stream_targets: ICD M1 budget FPR (outer tubes), pr_fan_inner (inner tubes) [KS]
annulus:
  fan_tip_diameter:
    value: 61.0
    unit: in
    tag: T
    note: about 61 in in docs/learning/CFM56-7B27_Parca_Bilgi_Dokumani.txt (secondary,
      no citation; primary source doğrulanmadı); M0 cycle_params uses the same value
      tagged T. Checked against the ICD fan_face_area in fan_design.py
  hub_tip_ratio:
    value: 0.3
    unit: '-'
    tag: T
    note: same value as M0 used for its W2/A check; confirmed against the ICD fan_face_area
      in fan_design.py
  exit_tip_radius_ratio:
    value: 0.98
    unit: '-'
    tag: T
    note: rotor exit casing radius / inlet tip radius; slightly converging casing
      over the blade, Rotor 67 survey stations give 24.4043/25.654 = 0.951 (Strazisar
      1989 p. 34, rotor67_reference.yaml) [H]; a high bypass fan casing converges
      less [T]
  exit_hub_radius_ratio:
    value: 1.3
    unit: '-'
    tag: T
    note: rotor exit hub radius / inlet hub radius; rising hub so that the inner tubes
      reach their pressure ratio with Vt2 below U2; Rotor 67 survey stations give
      12.0167/9.1465 = 1.314 (Strazisar 1989 p. 34) [H]. M1 step 3 used 1.45; with
      radial equilibrium and the full loss model (M1 step 4d) 1.45 gives the splitter-side
      inner tube more work from the radius rise than its equilibrium share even at
      1 deg camber, so 1.30 (close to Rotor 67) is used
  exit_core_area_fraction:
    value: 0.2
    unit: '-'
    tag: T
    note: initial share of the rotor exit annulus area given to the inner (core) tubes;
      since M1 step 4d radial equilibrium (solve_rotor_re) moves the exit areas, so
      this is only the starting point
stream_tubes:
  n_inner:
    value: 3
    unit: '-'
    tag: T
    note: inner (core) tubes between hub and splitter, equal inlet area (= equal mass
      flow with the uniform inlet of solve_rotor)
  n_outer:
    value: 6
    unit: '-'
    tag: T
    note: outer (bypass) tubes between splitter and tip, equal inlet area
blading:
  blade_count:
    value: 24
    unit: '-'
    tag: KS
    source: Girão 2023; Fox, Rossey, Raguet 2023, p. 1439
  design_incidence:
    value: 3.0
    unit: deg
    tag: T
    note: same at every tube; the Rotor 67 meanline design point gives 3.4 to 8.0
      deg (analysis/rotor67_validation.yaml) [H]; the lower end is taken to limit
      the shock loss
  pr_distribution:
    value: constant_work
    tag: T
    note: 'spanwise work distribution within each stream. constant_work: same Tt ratio
      in every tube of a stream (free-vortex type, r Vt2 about constant) [G], level
      set so the stream mass-averaged PR equals its ICD target. uniform_pr (M1 step
      3, R-AM.6): every tube at its stream PR; with radial equilibrium and the full
      loss model it runs away (M1 step 4d: tip tube takes 63 % of the exit area at
      tube efficiency 0.24, middle tubes choke), so it is kept only as an option'
  shock_expansion:
    value: linear_camber
    tag: T
    note: 'suction-surface expansion ahead of the passage shock. No CFM blade geometry
      exists, so tools/meanline.py ss_turn cannot be computed. linear_camber (used):
      tools/meanline.py default (incidence + covered fraction x camber), which over-predicted
      M_ss on Rotor 67 by up to +0.23 at the tip (M1 step 4c), so shock loss and required
      turning are likely high. rotor67_ss_turn (option): the Rotor 67 value at the
      same relative span (KS geometry; on Rotor 67 M_ss within +0.04 to +0.11 of the
      laser data); in M1 step 4d its R-AM.9 solidity pass did not settle (3-cycle
      at tube 6, whose DF at solidity_max sits at the Rotor 67 limit), so it is not
      used'
  outer_offset_span_limit:
    value: 0.8
    unit: '-'
    tag: T
    note: the per-stream kappa2 offset that brings the outer stream PR to FPR (fan_design.py
      design()) is applied only to tubes below this inlet span fraction; the tubes
      above keep their initial shape. 0.8 = start of the tip clearance loss region
      of tools/meanline.py (Zanoni p. 7) [KS extent]. With the offset on all outer
      tubes the extra camber at the high-loss tip drove solve_rotor_re onto a collapsed
      branch before FPR was reached (M1 step 4d trials)
  rotor67_sonic_span:
    value: 0.45
    unit: '-'
    tag: H
    note: 'R-AM.9 boundary (approved): Rotor 67 design-point sonic span, M1rel = 1
      between span 0.44 and 0.54 in learning/rotor67_reference.yaml computed_diffusion_factor;
      above it DF <= Rotor 67 DF and solidity >= Rotor 67 solidity, below it DF <=
      Rotor 67 DF only. Rotor 67 DF held constant outside its span range 0.11-0.92
      [T]'
  solidity_min:
    value: 1.0
    unit: '-'
    tag: T
    note: lower bound of the solidity search below the sonic span (R-AM.9 gives no
      solidity floor there)
  solidity_max:
    value: 3.2
    unit: '-'
    tag: T
    note: upper bound of the solidity search; Rotor 67 hub solidity 3.11 (Strazisar
      1989 p. 2) [KS]
losses:
  tip_clearance_running:
    value: 3.0
    unit: mm
    tag: T
    note: running tip clearance for the Endwall tip loss; Rotor 67 runs 1.0 mm at
      tip radius 256.5 mm (Strazisar p. 2, rotor67_reference.yaml) [KS], 0.39 % of
      the tip radius; scaled to the 774.7 mm fan tip radius this gives 3.0 mm. CFM56-7B
      running clearance doğrulanmadı; a large fan with an abradable liner may run
      tighter (conservative choice)
mechanical:
  area_taper_method:
    value: rotor67_tc_chord_squared
    tag: T
    note: blade section area tip/root = (t/c tip / t/c root) x (chord tip / chord
      root)^2 (similar section shapes) [G]; t/c from Rotor 67 sections 1 and 14 (rotor67_geometry.yaml
      max_thickness / chord) as an analogue [T]; chords from the design (hub and tip
      tubes); linear area taper in radius
  safety_factor:
    value: 1.5
    unit: '-'
    tag: T
    note: on the yield strength (materials.yaml ti6al4v yield_strength [KS]); centrifugal
      stress only, no gas bending, dovetail or fatigue
