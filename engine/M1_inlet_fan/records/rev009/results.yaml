    of the tube whose R-AM.9 need stands highest above both neighbour needs, w_b =
    smaller distance to its neighbour tubes (bump zero at both neighbour tube centres),
    a >= 0; lowest mean chord with every tube at or above its R-AM.9 need, the R-AM.13
    taper band and the root raised for the stress margin (linear programme)
