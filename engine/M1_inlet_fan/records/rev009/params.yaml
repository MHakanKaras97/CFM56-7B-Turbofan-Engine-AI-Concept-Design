description: M1 fan design inputs (analysis/fan_design.py). Budget values (W2, W21,
  Tt2, Pt2, FPR, pr_fan_inner) and the rotor speed are read from the ICD at run time
  through core.budgets.read_icd; they are not copied here.
icd_inputs:
  rotor_speed: ICD shafts.LP.speed_refs.girao_nominal (Girão 2023 nominal LP speed)
    [KS]
  inlet_state: ICD stations 2 Tt, Pt [H]
  mass_flows: ICD M1 budget W2, W21, W13 [H]
  stream_targets: ICD M1 budget FPR (outer tubes), pr_fan_inner (inner tubes) [KS]
annulus:
  fan_tip_diameter:
    value: 61.0
    unit: in
    tag: T
    note: about 61 in in docs/learning/CFM56-7B27_Parca_Bilgi_Dokumani.txt (secondary,
      no citation; primary source doğrulanmadı); M0 cycle_params uses the same value
      tagged T. Checked against the ICD fan_face_area in fan_design.py
  hub_tip_ratio:
    value: 0.3
    unit: '-'
    tag: T
    note: same value as M0 used for its W2/A check; confirmed against the ICD fan_face_area
      in fan_design.py
  exit_tip_radius_ratio:
    value: 0.95
    unit: '-'
    tag: T
    note: 'rotor exit casing radius / inlet tip radius; Rotor 67 survey stations give
      24.4043/25.654 = 0.951 (Strazisar 1989 p. 34, rotor67_reference.yaml) [H], used
      as analogue [T]. M1 steps 3-4d used 0.98. M1 step 4e trials [H]: with the smooth
      blade and 0.98 the design-mode radial equilibrium puts the hub tube at Vm2/V1
      about 0.53 (hub W2/W1 about 0.54) and the fixed-blade equilibrium collapses
      at the hub; 0.95 gives about 0.70 and a physical solution. CFM56-7B casing contour
      doğrulanmadı'
  exit_hub_radius_ratio:
    value: 1.3
    unit: '-'
    tag: T
    note: rotor exit hub radius / inlet hub radius; rising hub so that the inner tubes
      reach their pressure ratio with Vt2 below U2; Rotor 67 survey stations give
      12.0167/9.1465 = 1.314 (Strazisar 1989 p. 34) [H]. M1 step 3 used 1.45; with
      radial equilibrium and the full loss model (M1 step 4d) 1.45 gives the splitter-side
      inner tube more work from the radius rise than its equilibrium share even at
      1 deg camber, so 1.30 (close to Rotor 67) is used
  exit_core_area_fraction:
    value: 0.2
    unit: '-'
    tag: T
    note: initial share of the rotor exit annulus area given to the inner (core) tubes;
      since M1 step 4d radial equilibrium (solve_rotor_re) moves the exit areas, so
      this is only the starting point
stream_tubes:
  n_inner:
    value: 3
    unit: '-'
    tag: T
    note: inner (core) tubes between hub and splitter, equal inlet area (= equal mass
      flow with the uniform inlet of solve_rotor)
  n_outer:
    value: 6
    unit: '-'
    tag: T
    note: outer (bypass) tubes between splitter and tip, equal inlet area
blading:
  blade_count:
    value: 24
    unit: '-'
    tag: KS
    source: Girão 2023; Fox, Rossey, Raguet 2023, p. 1439
  design_incidence:
    value: 3.0
    unit: deg
    tag: T
    note: same at every tube; the Rotor 67 meanline design point gives 3.4 to 8.0
      deg (analysis/rotor67_validation.yaml) [H]; the lower end is taken to limit
      the shock loss
  profile_family:
    value: MCA
    tag: T
    note: 'R-AM.11: multiple-circular-arc type section (two-arc camber line joined
      at chord fraction 0.5 [T], parabolic thickness [T]); front camber share, t/c
      and x_max smooth in span from Rotor 67 Table I fits (analysis/blade_profile.py)
      [T analogue of KS]. DCA (front share 0.5, x_max 0.5) is the special case defined
      in NASA SP-36 PDF p. 204 (printed p. 186) [K]. Rotor 67 profile family not named
      in TP-2879 (PDF p. 6 refers to its refs. 11-12): doğrulanmadı'
  chord_law:
    value: quadratic_local_bump
    tag: T
    note: 'M1 step 4g (R-AM.13 chord law): chord(f) = quadratic + a (1 - x^2)^3, x
      = (f - f_b) / w_b, |x| < 1 (C2 compact bump, a >= 0); f_b = span fraction of
      the tube whose R-AM.9 need stands highest above both neighbour needs, w_b =
      smaller distance to its neighbour tubes, so the bump is zero at both neighbour
      tube centres [T rule]. Reason: the step 4f quadratic spread the single high
      need of tube 4 (first bypass tube above the splitter) over mid span; a cubic
      does not keep it local either (fan_design.mass_diagnosis chord_law_variants).
      Lowest mean chord, R-AM.9 needs, taper band and root stress loop unchanged'
  need_basis:
    value: balanced_state
    tag: T
    note: 'R-AM.9 need basis (M1 step 4h, user requirement): each tube''s solidity
      need from the work the blade actually does on the balanced state (radial equilibrium
      with the current blade), iterated blade -> equilibrium -> needs -> chord until
      no solidity need moves by more than 1e-3 (fan_design.NEED_STABLE); pass 0 sizes
      on the design-target needs; design-target needs reported as information. The
      R-AM.14 bump is placed from these needs'
  chord_smoothness_limit:
    value: 1.2685
    unit: per unit span fraction squared
    tag: H
    source: 'records/REVIEW.md 2026-10-27 (R-AM.17): largest |second divided difference|
      of c / c_mean over the 14 Rotor 67 Table I sections (rotor67_geometry.yaml chord
      [H from KS], Strazisar et al. NASA TP-2879 via BladeAtlas, docs/sources.md #41)'
    note: 'R-AM.17 (M1 step 4h): the limit is recomputed in code (blade_profile.rotor67_chord_smoothness)
      and must equal this recorded value to 4 decimals; the M1 metric at the tube
      centres is checked against it (pass/fail reported, not imposed in the chord
      sizing)'
  thickness_chord:
    value: rotor67_table1_benchmark
    tag: T
    note: 'M1 step 4g: t/c(f) = cubic fit of the Rotor 67 Table I sections, t/c =
      largest TNPC (thickness normal to the mean camber line, TP-2879 PDF p. 22, printed
      p. 18 [KS]) / section chord [H from KS], section span = leading-edge radius
      fraction (same as the M1 inlet span fraction); benchmark in results.yaml blade.tc_benchmark_rotor67.
      Applied to the CFM56-7B27 fan as an analogue [T]; CFM56-7B thickness doğrulanmadı'
  vortex:
    value: free_vortex_splitter_blend
    tag: T
    note: 'R-AM.12: blade shape designed for a free vortex in each stream (dh0 constant,
      r Vt2 constant without inlet swirl) [G], blended across the splitter: dh0(f)
      = dh_inner (1 - B(f)) + dh_outer B(f), B = C2 quintic smoothstep [T]; dh_inner,
      dh_outer solved so that both stream mass-averaged Tt ratios equal the stream
      levels (budget-efficiency levels in pass 0, then the achieved levels) [H]. M1
      step 4e trials [H]: an exponent vortex dh0 = A (r2/r_tip2)^n over the whole
      span (n about 1.4) and smooth power forms dh0 = h0 + h1 f^p (p = 2, 3) drive
      the hub tube onto a collapsed radial-equilibrium branch (hub exit area share
      about 0.7, efficiency below 0); the blended free vortex keeps the hub physical'
  offset_blend:
    value: splitter_blend
    tag: T
    note: 'R-AM.12 (step 4f: the total kappa2 is monotonic over the blend region,
      constrained least-squares fit in fan_design.kappa2_fit): the two stream kappa2
      offsets of the PR balance enter through the same blend, delta_inner (1 - B(f))
      + delta_outer B(f); B is C2, so the offsets cannot kink the continuous blade
      at the splitter. Replaces outer_offset_span_limit of M1 step 4d'
  kappa2_blend_direction:
    value: rising
    tag: T
    note: 'R-AM.12 (M1 step 4f): the total kappa2(f) (shape + blended stream offsets)
      must not fall anywhere in the splitter blend region (no dip, no local extremum);
      enforced in the kappa2 fit at 41 points and checked on 401 points (results.yaml
      kappa2_blend_check). Rising because kappa2 rises from hub to tip over the blade
      (rev005: 22 deg at the hub tube to 42 deg at the tip tube) [H]; a direction
      taken from each pass''s fit flipped between passes'
  kappa2_blend_curvature_limit:
    value: rotor67_max
    tag: T
    note: 'R-AM.12 (M1 step 4f): |d2 kappa2 / df2| of the final blade over the splitter
      blend region must not exceed the largest spanwise curvature of the Rotor 67
      exit metal angle (Table I te_metal_angle, blade_profile.rotor67_kappa2_curvature,
      about 340 deg per unit span fraction squared) [H from KS]. Reason: kappa2 curvature
      sets the spanwise gradient of the exit swirl and work; a blend sharper than
      a measured, well-behaved transonic rotor would put a local work gradient (and
      a section stacking kink) at the splitter. Per unit span fraction, not per metre,
      so the limit scales with the blade. Checked, not imposed (the monotonic fit
      already keeps it below)'
  splitter_blend_start:
    value: -0.25
    unit: '-'
    tag: T
    note: start of the splitter blend B(f) relative to the splitter, in inlet span
      fraction (B = 0 below f_split + start)
  splitter_blend_width:
    value: 0.5
    unit: '-'
    tag: T
    note: 'width of the splitter blend in inlet span fraction (B = 1 above f_split
      + start + width): symmetric, 0.25 of span on either side of the splitter. M1
      step 4e trials [H]: a blend that starts at the splitter (inner stream flat)
      makes the inner tubes reach their Tt target only below 1 deg camber at the design
      state'
  df_limit_hub:
    value: 0.6
    unit: '-'
    tag: K
    source: 'NASA SP-36 (1965), PDF p. 286 (printed p. 268): inlet stages, rotor hub
      D < 0.6; hub and mean loss follow the cascade trend up to about 0.6 (PDF p.
      257, printed p. 239)'
  df_limit_tip:
    value: 0.4
    unit: '-'
    tag: K
    source: 'NASA SP-36 (1965), PDF p. 286 (printed p. 268): inlet stages, rotor tip
      D < 0.4; rotor-tip loss rises above about 0.35 (PDF p. 257, printed p. 239)'
    note: 'R-AM.9 (step 4e) subsonic region: limit linear in span between df_limit_hub
      and df_limit_tip [T interpolation]; applied below the sonic span of this fan
      only'
  solidity_min:
    value: 1.0
    unit: '-'
    tag: T
    note: lower bound of the solidity search below the sonic span (R-AM.9 gives no
      solidity floor there)
  solidity_max:
    value: 3.2
    unit: '-'
    tag: T
    note: upper bound of the solidity search; Rotor 67 hub solidity 3.11 (Strazisar
      1989 p. 2) [KS]
tip_check:
  band_span_min:
    value: 0.8
    unit: '-'
    tag: T
    note: 'tip region of the like-for-like tip efficiency check (M1 step 4f): stream
      tubes with inlet centre span fraction >= 0.8, on the M1 fan and on Rotor 67
      at its design point, same solver and loss settings; tip clearance loss acts
      above span 0.8 (Zanoni p. 16) [KS]'
  band_span_min_sensitivity:
    value: 0.7
    unit: '-'
    tag: T
    note: second band reported as a sensitivity of the tube discretisation
  eta_gap_limit:
    value: 0.03
    unit: '-'
    tag: T
    note: 'user rule (M1 step 4f): if the M1 tip-region meanline efficiency is more
      than 3 points below the Rotor 67 model value, a controlled vortex shifts work
      from the tip toward mid span at constant outer FPR; otherwise the free vortex
      stays'
losses:
  tip_clearance_running:
    value: 3.0
    unit: mm
    tag: T
    note: running tip clearance for the Endwall tip loss; Rotor 67 runs 1.0 mm at
      tip radius 256.5 mm (Strazisar p. 2, rotor67_reference.yaml) [KS], 0.39 % of
      the tip radius; scaled to the 774.7 mm fan tip radius this gives 3.0 mm. CFM56-7B
      running clearance doğrulanmadı; a large fan with an abradable liner may run
      tighter (conservative choice)
mechanical:
  area_method:
    value: integrated_section_area
    tag: T
    note: 'R-AM.13 (M1 step 4f): section area A(f) = k t/c(f) chord(f)^2 with k =
      2/3 (parabolic thickness arcs of the R-AM.11 profile) [H from T]; t/c fixed
      by the Rotor 67 fit (analogue) [T]; root stress, the stress of every section
      and the blade mass integrate A along the span; the chord LP keeps the taper
      band and the root chord is raised until every section has stress_margin_min.
      Replaces the step 4e endpoint taper with a linear area (smooth_blade_tc_chord_squared),
      which ignored the mid-span chord (rules/aero_method.md R-AM.13)'
  area_taper_min:
    value: 0.3
    unit: '-'
    tag: G
    note: 'lower end of the section-area taper A_tip/A_root band (chord LP constraint);
      no source with a page in the M1 source set (Sjögren, SP-36, Mirghani searched;
      SP-36 printed p. 34, PDF p. 52 defines a stress taper factor for turbine blades,
      not this range): doğrulanmadı. Rotor 67 Table I gives 0.335 [H from KS, blade_profile.rotor67_section_areas]'
  area_taper_max:
    value: 0.5
    unit: '-'
    tag: G
    note: upper end of the section-area taper band; same status as area_taper_min.
      Replaces the step 4e bound area_taper_max = 1.0 (applied at the blade ends only)
  area_monotonic:
    value: true
    tag: G
    note: 'R-AM.16 (M1 step 4h): section area A(f) = k t/c(f) chord(f)^2 non-increasing
      from root to tip, dA/df <= 1e-9 A_root on the 201-point span grid; a linear
      constraint of the chord programme (cutting planes, fan_design.lowest_chord_monotonic)
      together with the taper band. Supersedes the R-AM.13 sentence No monotonic-area
      constraint'
  stress_margin_min:
    value: 1.0
    unit: '-'
    tag: T
    note: 'required margin allowable / sigma - 1 at every section (largest section
      stress; the root for this blade), allowable = yield / safety_factor (user requirement:
      root margin >= 1.0, M1 step 4f); the design raises the root chord in 1 % steps
      until it holds'
  blade_set_mass_check:
    value: 118
    unit: kg
    tag: KS
    source: 'Mirghani 2023, Table 3, printed p. 49 (PDF p. 67), citing other sources
      (weak: student thesis)'
    note: 24 fan blades together; a sanity check of the computed airfoil mass, not
      a design input (rules/bom.md)
  safety_factor:
    value: 1.5
    unit: '-'
    tag: T
    note: on the yield strength (materials.yaml ti6al4v yield_strength [KS]); centrifugal
      stress only, no gas bending, dovetail or fatigue
