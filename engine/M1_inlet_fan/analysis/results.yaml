    law: free_vortex
    law_statement: 'free vortex in each stream (r Vt2 constant, dh0 constant) with
      the C2 splitter blend; no controlled vortex: tip-region meanline eta of this
      fan minus the Rotor 67 model +0.0035 (limit -0.03), tip_region.decision [H,
      rule T]'
    controlled_vortex: false
    form: 'free vortex (dh0 = U2 Vt2 constant, r Vt2 constant without inlet swirl)
      in each stream [G], blended across the splitter: dh0(f) = dh_inner (1 - B(f))
