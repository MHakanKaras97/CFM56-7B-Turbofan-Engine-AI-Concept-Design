  - 2.44828
  - 3.7539
  - 18.24845
  - -1.98306
  kappa2_form: kappa2(f) = k0 + k1 f + k2 f^2 + k3 f^3 + k4 B(f) (least squares over
    the tubes at their vortex targets) + delta_inner (1 - B(f)) + delta_outer B(f);
    B = C2 quintic smoothstep from f_split + -0.25 to f_split + 0.25 (f_split 0.27371)
    [T]; total coefficients include the offsets
  kappa1_form: kappa1 = atan(omega r1 / V1) - design incidence (uniform axial inlet,
    V1 = 197.628 m/s) [H]; incidence 3.0 deg [T]
  profile_family: 'MCA (R-AM.11): two-arc camber line, transition at chord fraction
