description: CS-E 800 bird quantities and masses by engine inlet throat area A (m2); read by analysis/bird_class.py
source:
  primary: EASA Easy Access Rules for Engines (CS-E), Amendment 5, CS-E 800 (b)(1)(ii), (c)(1)(iii), (d)(1)(v)(B), Table A, pp. 180-184
  file: <archive>/M1_inlet_fan/regulation/easa_cs-e_easy_access_amdt5.pdf
  tag: K
  note: bands are lower <= A < upper; upper null = no upper limit; read with pdftotext -raw
large_single:
  speed_kn: 200
  bands:
  - {lower: 0.0, upper: 1.35, birds: [[1, 1.85]]}
  - {lower: 1.35, upper: 3.90, birds: [[1, 2.75]]}
  - {lower: 3.90, upper: null, birds: [[1, 3.65]]}
large_flocking:
  speed_kn: 200
  bands:
  - {lower: 0.0, upper: 2.50, birds: []}
  - {lower: 2.50, upper: 3.50, birds: [[1, 1.85]]}
  - {lower: 3.50, upper: 3.90, birds: [[1, 2.10]]}
  - {lower: 3.90, upper: null, birds: [[1, 2.50]]}
medium_flocking:
  note: Table A; engine test = CS-E 800(d)(1), integrity = additional integrity assessment CS-E 800(d)(3); birds as [number, mass kg]
  bands:
  - {lower: 0.0, upper: 0.05, engine_test: [], integrity: []}
  - {lower: 0.05, upper: 0.10, engine_test: [[1, 0.35]], integrity: []}
  - {lower: 0.10, upper: 0.20, engine_test: [[1, 0.45]], integrity: []}
  - {lower: 0.20, upper: 0.40, engine_test: [[2, 0.45]], integrity: []}
  - {lower: 0.40, upper: 0.60, engine_test: [[2, 0.70]], integrity: []}
  - {lower: 0.60, upper: 1.00, engine_test: [[3, 0.70]], integrity: []}
  - {lower: 1.00, upper: 1.35, engine_test: [[4, 0.70]], integrity: []}
  - {lower: 1.35, upper: 1.70, engine_test: [[1, 1.15], [3, 0.70]], integrity: [[1, 1.15]]}
  - {lower: 1.70, upper: 2.10, engine_test: [[1, 1.15], [4, 0.70]], integrity: [[1, 1.15]]}
  - {lower: 2.10, upper: 2.50, engine_test: [[1, 1.15], [5, 0.70]], integrity: [[1, 1.15]]}
  - {lower: 2.50, upper: 2.90, engine_test: [[1, 1.15], [6, 0.70]], integrity: [[1, 1.15]]}
  - {lower: 2.90, upper: 3.90, engine_test: [[1, 1.15], [6, 0.70]], integrity: [[2, 1.15]]}
  - {lower: 3.90, upper: 4.50, engine_test: [[3, 1.15]], integrity: [[1, 1.15], [6, 0.70]]}
  - {lower: 4.50, upper: null, engine_test: [[4, 1.15]], integrity: [[1, 1.15], [6, 0.70]]}
small:
  mass_kg: 0.085
  area_per_bird_m2: 0.032
  max_birds: 16
  note: one bird per 0.032 m2 of A or fraction thereof
