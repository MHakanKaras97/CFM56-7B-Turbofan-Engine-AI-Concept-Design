version: 4.2
design_point:
  description: SLS ISA, max take-off, base CFM56-7B27 (SAC, ICAO UID 3CM034); see ADR-005
  T0: {value: 288.15, unit: K, tag: G}
  P0: {value: 101325.0, unit: Pa, tag: G}
  M0: {value: 0.0, unit: '-', tag: G}
reference_data:
  thrust_to: {file: engine/M0_engine/rules/tcds_e004.yaml, key: ratings.CFM56-7B27.takeoff_thrust, tag: K}
  icao_row: {file: engine/M0_engine/rules/icao_edb_cfm56_7b27.yaml, uid: 3CM034, fields: [pressure_ratio, bpr, fuel_flow_to_kg_s], tag: K}
  sfc_ref: {file: engine/M0_engine/analysis/sfc_takeoff.yaml, uid: 3CM034, tag: H}
  girao: {file: engine/M0_engine/rules/girao_2023.yaml, tag: KS}
gas:
  model: nasa_glenn
  note: 'nasa_glenn = variable cp(T, FAR), air + C12H23 products (tools/thermo.py); constant_cp = one ideal gas, closed-form checks only'
  data: tools/data/nasa_glenn.yaml
  constant_cp:
    cp: {value: 1005.0, unit: J/(kg K), tag: G}
    gamma: {value: 1.40, unit: '-', tag: G}
    R: {value: 287.0, unit: J/(kg K), tag: G}
components:
  efficiency_basis: isentropic (GasTurb inputs, Girão 2023 Fig. 4.9); no polytropic conversion
  inlet_recovery: {value: 0.99, unit: '-', tag: KS, source: Girão 2023, note: P2/P1}
  FPR: {value: 1.765, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: outer fan P13/P2; input (ADR-008)}
  eta_fan_outer: {value: 0.878, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: isentropic}
  pr_fan_inner: {value: 1.344, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: P21/P2}
  eta_fan_inner: {value: 0.870, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: isentropic}
  pr_booster: {value: 2.004, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: P24/P21}
  eta_booster: {value: 0.890, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: isentropic}
  duct_25_24: {value: 0.98, unit: '-', tag: KS, source: Girão 2023, note: P25/P24; P25/P2 = 1.344 * 2.004 * 0.98}
  eta_hpc: {value: 0.8363, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: isentropic}
  burner_eta: {value: 0.9995, unit: '-', tag: KS, source: Girão 2023}
  burner_pr: {value: 0.95, unit: '-', tag: KS, source: Girão 2023, note: P4/P3}
  eta_hpt: {value: 0.880, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: isentropic}
  duct_45_44: {value: 0.98, unit: '-', tag: KS, source: Girão 2023, note: P45/P44}
  eta_lpt: {value: 0.9173, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: isentropic}
  duct_6_5: {value: 0.99, unit: '-', tag: KS, source: Girão 2023, note: P6/P5, core exhaust duct}
  bypass_duct: {value: 0.975, unit: '-', tag: KS, source: Girão 2023, note: P16/P13}
  mech_eff: {value: 0.99, unit: '-', tag: KS, source: Girão 2023}
  cfg_18: {value: 1.00998, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: bypass nozzle thrust coefficient}
  cfg_8: {value: 1.0, unit: '-', tag: T, note: core nozzle thrust coefficient; not shown by Girão, GasTurb default}
  cd_18: {value: 0.99756, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: discharge coefficient, area only}
  cd_8: {value: 0.99492, unit: '-', tag: KS, source: Girão 2023 Fig. 4.9, note: discharge coefficient, area only}
  LHV: {value: 43.124e6, unit: J/kg, tag: T, note: 'assumed GasTurb generic fuel, not in the thesis; reference 298.15 K, fuel enters at 298.15 K'}
secondary_air:
  description: Fractions of W25, bypass the combustor
  ngv: {value: 0.05, unit: '- of W25', tag: KS, source: Girão 2023, note: bled at HPC exit, mixes before HPT rotor (T41), does HPT work}
  hpt_rotor: {value: 0.06, unit: '- of W25', tag: KS, source: Girão 2023, note: bled at HPC exit, mixes at HPT exit (station 44), no HPT work}
  leak: {value: 0.02, unit: '- of W25', tag: KS, source: Girão 2023, note: 'leaves the HPC before its exit (Girão W3 60.499 < W25 61.733), returned at station 45'}
  leak_bleed_point: {value: 0.5, unit: '- of HPC enthalpy rise', tag: T}
  customer_bleed: {value: 0.0, unit: kg/s, tag: T, note: ICAO test bleed not verified}
  hp_power_offtake: {value: 0.0, unit: W, tag: KS, source: Girão 2023 Fig. 4.9}
geometry:
  fan_diameter: {value: 61.0, unit: in, tag: T}
  fan_hub_tip: {value: 0.30, unit: '-', tag: T}
calibration:
  unknowns: [W2, T4]
  targets:
    thrust: {source: tcds, tag: K}
    fuel: {source: icao, tag: K}
  initial:
    W2: {value: 354.7, unit: kg/s, tag: T}
    T4: {value: 1650.0, unit: K, tag: T}
  tolerance: {value: 1.0e-9, unit: '-', tag: G}
checks:
  fan_choke: {hard: true, basis: 'max mass flux at M=1 for SLS ISA total conditions (P0, T0), air', tag: H}
  w2a_range: {min: 190.0, max: 215.0, unit: kg/(s m2), tag: G}
  w2_ref: {value: 354.7, unit: kg/s, tag: T, tolerance: 0.10}
  cooling_range: {min: 0.12, max: 0.22, unit: '- of W25, total secondary air', tag: G}
  sfc_tolerance: {value: 0.005, unit: '-', tag: G}
  egt_limit: {file: engine/M0_engine/rules/tcds_e004.yaml, keys: [limits.egt_takeoff_displayed, limits.egt_shunt_sac], tag: K, note: 'displayed = measured (T49.5) + 30 K shunt for SAC'}
  egt: {a: 0.976, b: 0.217, tag: KS, form: 'EGT = a*(T45 - b*(T45 - T5)), in K', note: 'Girão 2023 Fig. 4.10 uses a = 0.976, the text gives 0.9664; CFM56-3 origin via Martins 2015'}
  combustor_air_refs:
    lopez_pintor: {value: 44.52, unit: kg/s, tag: KS, note: modeled value, ADR-007}
    girao_W31_125.7kN: {value: 53.71, unit: kg/s, tag: KS}
  T4_refs:
    estimate: {value: 1450.0, unit: K, tag: T, note: unit unclear in source}
    indriyati_turbine_in: {value: 1553.0, unit: K, tag: KS, note: test cell, not ISA}
  T3_ref: {value: 832.4, unit: K, tag: KS, note: test cell T0 298 K, not ISA; info only}
rated_case:
  description: ICAO -7B27 rating (thrust, fuel, BPR, OPR from reference_data); Girão FPR and core split kept
  delta_eta_sweep: {min: 0.0, max: 0.03, step: 0.005, extend_to: 0.06, unit: '-', tag: G, note: 'uniform delta added to all isentropic turbomachinery efficiencies; beyond max is flagged'}
sensitivity:
  eta_step: 0.01
  LHV_rel_step: 0.003
  outputs: [W2, T4, EGT]
