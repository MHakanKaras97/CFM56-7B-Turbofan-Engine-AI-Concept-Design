reason: '#77 (a)/(b): the core/bypass divider wall is modelled twice and the M1 splitter
  ring M1.4.3 lies inside the M2 booster flow path. M1 put the splitter thickness
  inward (inner face 0.424818 m), M2 put its casing M2.0.2 outward (0.433488-0.442158
  m), same wall over x 0.270-0.635 m; OGV M1.3.1 and bypass struts M1.4.4 cross the
  M2 casing and vane feet. No M2-side fix exists (casing inner face = rev001 tip radius).
  Proposal (option a): remove M1.4.3 from M1, the divider wall is owned by M2 as M2.0.2
  from station 21 aft; raise the root radius of M1.3.1 and M1.4.4 to 0.442158 m =
  r_split2 0.433488 + M2 casing thickness 0.008670 [H]; M7 station 13 inner radius
  becomes 0.442158 m. Not expressible as BOM changes and part of the M1 work: M1 geometry
  rule/code (fan_frame.py splitter removed, ogv.py and strut root at r_split2 + wall),
  VBV openings move out of M1.4.3 (owner open, #48), bypass strut loads land on the
  M2 casing [T]; M1 is accepted (rev014), so a new M1 design revision is needed (ADR-012).
  Option b: keep M1.4.3 and move it outward (two walls), OGV/strut root 0.451001 m
  [H]. Source: engine/M2_booster/learning/geometri_celiskileri.md (#77); impact engine/M0_engine/analysis/cr_impact_77.py.'
