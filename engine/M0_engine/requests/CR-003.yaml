reason: '#77 (c): the M1 core struts M1.4.5 (x 0.4937-0.6192 m) and the core-side
  frame cross the rotating M2 booster drum and rotor/stator rows; the hub ring and
  bearing flange inside the drum can only be tied to the splitter through the drum.
  No M2-side fix exists: the booster rows need 0.325786 m from station 21, 0.067411
  m more than the space to the strut leading edge; the axial gap ratio that would
  end S3 at the strut is -0.2096 (frame start -0.2584), negative [H]. Proposal: move
  the core-side frame (hub ring M1.4.1 with the M8 bearing flange, core struts M1.4.5)
  aft by 0.163497 m so the frame starts at station 24 x 0.641557 m (strut leading
  edge at least 0.147812 m aft; with the frame start at station 24 the LE is at x
  0.657241) and fit the core passage to the M2 station 24/25 annulus r 0.366240-0.433488
  m [T]. The M8 bearing flange moves with the hub ring, inner radius kept at 0.151065
  m. Bypass struts M1.4.4, outer ring, OGV and station 13 stay. Depends on CR-A option
  a: with M1.4.3 removed, a frame-zone core/bypass wall ring (station 24 to the new
  frame end, r_split2 to r_split2 + wall) is added as M1.4.6. Not expressible as BOM
  changes: fan_frame.py layout (frame zone behind station 24, core passage radii from
  M2), load path bypass strut -> M2 casing / wall ring -> core strut [T], transition
  duct 24 -> 25 not modelled (may need more length). New M1 design revision (ADR-012).
  Source: engine/M2_booster/learning/geometri_celiskileri.md (#77); impact engine/M0_engine/analysis/cr_impact_77.py.'
